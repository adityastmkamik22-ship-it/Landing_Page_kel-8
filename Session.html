<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celerates — Vocabulary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

    <nav class="app-navbar">

        <a href="index.html" class="logo">
            Celerates<span>.</span>
        </a>

        <div class="session-counter">
            03 / 10
        </div>

        <a href="belajar.html" class="exit-button">
            Exit
        </a>

    </nav>


    <main class="lesson-page">

        <div class="lesson-progress-header">

            <span>
                Vocabulary
            </span>

            <span>
                30%
            </span>

        </div>


        <div class="progress-track">
            <div style="width:30%;"></div>
        </div>


        <div class="question-card">

            <p class="question-label">
                CHOOSE THE CORRECT ANSWER
            </p>

            <h1>
                I usually ___ coffee
                in the morning.
            </h1>


            <div class="answer-list">

                <button class="answer">
                    Drink
                </button>

                <button class="answer">
                    Drinks
                </button>

                <button class="answer">
                    Drinking
                </button>

                <button class="answer">
                    Drank
                </button>

            </div>


            <a href="progress.html" class="primary-button check-button">
                Check Answer
                <span>→</span>
            </a>

        </div>


        <p class="lesson-tip">
            💡 Tip: Pay attention to the subject "I".
        </p>

    </main>

</body>

</html>
